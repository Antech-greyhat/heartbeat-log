
name: Streak guard

on:
  # Times are UTC. Kenya = UTC+3. Odd minutes avoid the busy :00 slot.
  schedule:
    - cron: "17 7 * * *"   # 10:17 Kenya
    - cron: "17 10 * * *"  # 13:17 Kenya
    - cron: "23 18 * * *"  # 21:23 Kenya
    - cron: "23 20 * * *"  # 23:23 Kenya
    - cron: "37 22 * * *"  # 01:37 Kenya - last backup before the UTC day ends (03:00 Kenya)

  workflow_dispatch:
    inputs:
      force:
        description: "Make a test commit even if I was already active today"
        type: boolean
        default: false


permissions:
  contents: write

jobs:
  heartbeat:
  
    uses: Antech-greyhat/commit-heartbeat/.github/workflows/heartbeat.yml@v1
    
    permissions:
      contents: write
    with:
      
      force: ${{ inputs.force == true }}
      target: 15
    
    secrets: inherit
